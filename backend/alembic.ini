[alembic]
# Folder that contains env.py and the migration files in alembic/versions.
script_location = alembic

# Add the project root to Python's import path so Alembic can import app modules.
prepend_sys_path = .

# Keep this blank because alembic/env.py reads DATABASE_URL from .env.
sqlalchemy.url =

[post_write_hooks]

[loggers]
# Configure which loggers Alembic uses while running migrations.
keys = root,sqlalchemy,alembic

[handlers]
# Send migration logs to the terminal.
keys = console

[formatters]
# Use the generic log format defined at the bottom of this file.
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
